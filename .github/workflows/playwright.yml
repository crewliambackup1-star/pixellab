name: PixelLab Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify PixelLab files
        run: |
          test -f index.html
          test -f app.js
          test -f catalog.js
          test -f styles.css
          echo "All core PixelLab files verified!"

      - name: Verify JavaScript syntax
        run: |
          node --check app.js
          node --check catalog.js
