name: PixelLab Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify PixelLab files
        run: |
          test -f index.html
          test -f app.js
          test -f catalog.js
          test -f styles.css
          echo "PixelLab files verified successfully!"
