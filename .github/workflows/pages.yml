name: Deploy PixelLab to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)];
          if (scripts.length === 0) throw new Error('No inline JavaScript found in index.html');
          scripts.forEach((match, index) => new vm.Script(match[1], { filename: 'index.html:inline-script-' + (index + 1) }));
          console.log('Parsed ' + scripts.length + ' inline script(s) successfully.');
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
