name: Deploy PixelLab to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const start = html.indexOf('<script>');
          const end = html.indexOf('</script>', start + 8);
          if (start < 0 || end < 0) throw new Error('Could not find the inline script in index.html');
          new vm.Script(html.slice(start + 8, end), { filename: 'index.html:inline-script' });
          console.log('Inline JavaScript syntax is valid.');
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
